  BOOT.categories.forEach((cat) => {
    const wrap = document.createElement("div");
    wrap.className = "field"; wrap.style.margin = "0";
    const id = "s-attr-" + sAttrSels.length;
    wrap.innerHTML = `<label for="${id}">${esc(cat.label)}</label>`;
    const sel = document.createElement("select");
    sel.className = "ctl"; sel.id = id;
    sel.innerHTML = cat.choices.map((c) =>
      `<option value="${esc(c)}">${esc(c === "Auto" ? "不指定" : c)}</option>`).join("");
    wrap.appendChild(sel);
    $("#s-attrs").appendChild(wrap);
    sAttrSels.push(sel);
    sel.addEventListener("change", updateInstruct);
  });
  function instructValue() {
    return toInstruct(sAttrSels.map((s) => s.value));
  }
  function updateInstruct() {
    const inst = instructValue();
    $("#s-instruct-preview").innerHTML = inst
      ? `将发送的指令：<code>${esc(inst)}</code>`
      : "未选择：按音色原本的声音合成。";
  }
  /* 回填：逐选项算一次 toInstruct() 再比对，比反解析字符串可靠 ——
     记录里存的是规范化后的值（口音是英文、方言是中文），不是下拉的显示值。 */
  function applyInstruct(str) {
    const want = (str || "").split(/[,，]/).map((x) => x.trim()).filter(Boolean);
    sAttrSels.forEach((sel, i) => {
      const pick = BOOT.categories[i].choices.find(
        (c) => c !== "Auto" && want.includes(toInstruct([c])));
      sel.value = pick || "Auto";
    });
    updateInstruct();
  }
  updateInstruct();

  const sCard = $("#s-voice-card");
  const sGo = $("#s-go");
  const sGoHint = $("#s-go-hint");
  let picked = null;
  let pickSig = "\u0000";          // 用签名去重，避免每次刷新音色都重建卡片（会打断试听）

  /* 音色确认卡：选音色是全页唯一的输入，只显示一个名字等于让人凭记忆赌一把，
     所以把它做成能直接播的，并把时长摆在明面上。 */
  function renderPick(force) {
    const sig = picked
      ? `${picked.name}|${picked.ref_text}|${picked.duration}|${picked.url}` : "";
    if (!force && sig === pickSig) return;
    pickSig = sig;

    if (!picked) {
      const none = !voices.some((v) => v.ref_audio);
      sCard.innerHTML =
        `<div class="vcard-empty">
           <p>${none ? "音色库还是空的。" : "还没有选择音色。"}音色在「音色库」里上传、裁剪并保存。</p>
           <button type="button" class="btn btn-secondary btn-sm" data-role="golib">
             ${none ? "去新建一个音色" : "前往音色库"}</button>
         </div>`;
      $("[data-role=golib]", sCard).addEventListener("click", () => gotoTab("library"));
      return;
    }
    if (!picked.url) {
      sCard.innerHTML = `<div class="vcard-empty">
          <p>音色「${esc(picked.name)}」的参考音频文件已丢失，请到音色库重新上传。</p></div>`;
      return;
    }
    const long = isLong(picked.duration);
    sCard.innerHTML =
      `<div class="vcard">
         <div class="vcard-top">
           <span class="vcard-name">${esc(picked.name)}</span>
           <span class="badge" data-state="${long ? "warn" : "done"}">${fmtDur(picked.duration)}</span>
         </div>
         <div data-role="player"></div>
         <p class="vcard-text">${picked.ref_text
           ? esc(picked.ref_text)
           : "这个音色还没有参考文本，首次生成时会自动转写一次并永久缓存。"}</p>
         ${long ? `<p class="hint" style="margin:8px 0 0">参考音频偏长（建议 ${lbl.recommended[0]}–${lbl.recommended[1]} 秒），合成会明显变慢 —— 可在音色库里裁剪。</p>` : ""}
       </div>`;
    buildPlayer($("[data-role=player]", sCard)).audio.src = picked.url;
  }

  function updateGo() {
    const missing = !picked ? "先从音色库选择一个音色"
      : (!$("#s-text").value.trim() ? "请输入要合成的文本" : "");
    sGo.disabled = !!missing;
    sGoHint.textContent = missing;
  }

  const sVoice = makeCombo($("#s-voice-combo"), [], {
    value: "", id: "s-voice", placeholder: "搜索或选择音色…",
    onChange: (v) => {
      const hit = voices.find((x) => x.name === v);
      picked = hit && hit.ref_audio ? hit : null;
      renderPick();
      updateGo();
    },
  });
  $("#s-text").addEventListener("input", updateGo);

  sGo.addEventListener("click", () => {
    if (!picked) return;
    const p = sSet.get;
    runJob({ res: sRes, params: {
      mode: "clone",
      text: $("#s-text").value,
      language: sLang.value,
      ref_audio: picked.ref_audio,
      voice_name: picked.name,          // 只为了合成记录里说得出用的是谁
      instruct: instructValue(),
      num_step: p("num_step"), guidance_scale: p("guidance_scale"),
      denoise: p("denoise"), speed: p("speed"), duration: p("duration"),
      preprocess_prompt: p("preprocess_prompt"),
      postprocess_output: p("postprocess_output"),
      chunk_duration: p("chunk_duration"),
    }, onDone: afterJob });
  });

  /* ---------- 语音设计（本次不动） ---------- */
  const dLang = makeCombo($("#d-lang-combo"), BOOT.languages,
    { value: "Auto", id: "d-lang", placeholder: "Auto（自动识别）" });
  const dRes = buildResult($("#d-result"));
  const dSet = buildSettings($("#d-details"), BOOT.profile);

  const attrSels = [];
  const attrsHost = $("#d-attrs");
  BOOT.categories.forEach((cat) => {
    const wrap = document.createElement("div");
    wrap.className = "field"; wrap.style.margin = "0";
    const id = "d-attr-" + attrSels.length;
    wrap.innerHTML = `<label for="${id}">${esc(cat.label)}</label>`;
    const sel = document.createElement("select");
    sel.className = "ctl"; sel.id = id;
    sel.innerHTML = cat.choices.map((c) =>
      `<option value="${esc(c)}">${esc(c === "Auto" ? "不指定" : c)}</option>`).join("");
    wrap.appendChild(sel);
    attrsHost.appendChild(wrap);
    attrSels.push(sel);
    sel.addEventListener("change", updatePreview);
  });
  function updatePreview() {
    const inst = toInstruct(attrSels.map((s) => s.value));
    $("#d-preview").innerHTML = inst
      ? `将发送的指令：<code>${esc(inst)}</code>`
      : "未选择任何属性：模型会自行挑选一个音色。";
  }
  updatePreview();

  $("#d-go").addEventListener("click", () => {
    const p = dSet.get;
    runJob({ res: dRes, params: {
      mode: "design",
      text: $("#d-text").value,
      language: dLang.value,
      groups: attrSels.map((s) => s.value),
      num_step: p("num_step"), guidance_scale: p("guidance_scale"),
      denoise: p("denoise"), speed: p("speed"), duration: p("duration"),
      preprocess_prompt: p("preprocess_prompt"),
      postprocess_output: p("postprocess_output"),
      chunk_duration: p("chunk_duration"),
    }, onDone: afterJob });
  });

  /* ============================================================
     音色库：新建（上传 → 裁剪 → 保存）+ 管理
     ============================================================ */
  let sel = [];         // 勾选 = 待删除
  let current = null;   // 高亮 = 正在查看（与勾选分离，两件事互不干扰）

  /* ---------- 新建音色：上传投放区 ---------- */
  const lDrop = $("#l-drop");
  lDrop.innerHTML =
    `<div class="drop" role="button" tabindex="0" data-role="drop">
       <span class="drop-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
         <path d="M12 16V4M8 8l4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></span>
       <span class="drop-txt">
         <span class="drop-t" data-role="t">选择参考音频文件</span>
         <span class="drop-s" data-role="s">或拖放到这里 · wav / mp3 / flac · 建议 ${lbl.recommended[0]}–${lbl.recommended[1]} 秒</span>
       </span>
       <button class="drop-x hidden" type="button" data-role="clear" aria-label="移除参考音频">×</button>
     </div>
     <input type="file" accept="audio/*" hidden data-role="file">`;
  const lDropEl = $("[data-role=drop]", lDrop);
  const lFileEl = $("[data-role=file]", lDrop);
  const lSaveWrap = $("#l-savewrap");
  const lName = $("#l-new-name");
  const lText = $("#l-new-text");
  const lAlerts = $("#l-new-alerts");
  let lUpload = null;      // { path, name, url }
  let lTextAuto = true;    // 参考文本是不是「自动转写来的」——决定换选区后要不要清空

  const lEd = createEditor($("#l-editor"), {
    recommended: lbl.recommended, min: lbl.min,
    onChange: () => {
      // 选区一变，上一轮转写的文本就对不上了。只有「自动来的」才自动清，
      // 手写的文本是用户的劳动成果，不能替他丢。
      if (lTextAuto && lText.value.trim()) lText.value = "";
      updateTextHint();
    },
  });

  function newBadge(state, text) {
    const b = $("#l-new-badge");
    b.dataset.state = state;
    b.textContent = text;
  }

  function updateTextHint() {
    const v = lEd.value();
    const span = v.end > v.start ? `选区 ${(v.end - v.start).toFixed(2)}s` : "当前选区";
    lText.value.trim()
      ? $("#l-new-texthint").textContent =
          (lTextAuto ? `由转写生成（${span}），可直接改写。` : `手动填写（${span}）。`)
      : $("#l-new-texthint").textContent = `留空则保存时自动转写（${span}）。`;
  }

  function trimPayload() {
    // 全选就不带 trim：后端于是原样搬运文件，省掉一次无谓的重编码
    return lEd.isWhole() ? null : lEd.value();
  }

  function setUpload(r) {
    lUpload = r;
    lAlerts.innerHTML = "";
    if (!r) {
      lEd.clear();
      lSaveWrap.classList.add("hidden");
      lName.value = ""; lText.value = "";
      lDropEl.classList.remove("has");
      $("[data-role=t]", lDrop).textContent = "选择参考音频文件";
      $("[data-role=s]", lDrop).textContent =
        `或拖放到这里 · wav / mp3 / flac · 建议 ${lbl.recommended[0]}–${lbl.recommended[1]} 秒`;
      $("[data-role=clear]", lDrop).classList.add("hidden");
      newBadge("idle", "待上传");
      return;
    }
    lDropEl.classList.add("has");
    $("[data-role=t]", lDrop).textContent = r.name;
    $("[data-role=s]", lDrop).textContent = "点击可更换 · 拖放可替换";
    $("[data-role=clear]", lDrop).classList.remove("hidden");
    lSaveWrap.classList.remove("hidden");
    lText.value = ""; lTextAuto = true;
    newBadge("running", "解码中…");
    lEd.load(r.url, r.name)
      .then(() => { newBadge("done", "待命名"); updateTextHint(); })
      .catch((e) => {
        newBadge("error", "解码失败");
        lAlerts.innerHTML = alertHTML(e.message, "error");
      });
  }

  async function uploadRef(file) {
    if (!file) return;
    newBadge("running", "上传中…");
    try {
      const fd = new FormData(); fd.append("file", file);
      const r = await api("/api/upload", { method: "POST", body: fd });
      lFileEl.value = "";
      setUpload({ path: r.path, name: r.name, url: r.url });
    } catch (e) {
      newBadge("error", "上传失败");
      lAlerts.innerHTML = alertHTML(e.message, "error");
    }
  }

  lDropEl.addEventListener("click", (e) => {
    if (e.target.closest("[data-role=clear]")) return;
    lFileEl.click();
  });
  lDropEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); lFileEl.click(); }
  });
  $("[data-role=clear]", lDrop).addEventListener("click", (e) => {
    e.stopPropagation();
    setUpload(null);
  });
  lFileEl.addEventListener("change", () => uploadRef(lFileEl.files[0]));
  ["dragenter", "dragover"].forEach((t) =>
    lDropEl.addEventListener(t, (e) => { e.preventDefault(); lDropEl.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) =>
    lDropEl.addEventListener(t, () => lDropEl.classList.remove("over")));
  lDropEl.addEventListener("drop", (e) => { e.preventDefault(); uploadRef(e.dataTransfer.files[0]); });

  /* ---------- 新建音色：试转写 ---------- */
  $("#l-new-asr").addEventListener("click", async () => {
    if (!lUpload) return;
    const btn = $("#l-new-asr");
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "转写中…";
    newBadge("running", "转写中…");
    try {
      const r = await api("/api/transcribe", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: lUpload.path, trim: trimPayload() }),
      });
      lText.value = r.text;
      lTextAuto = true;
      newBadge("done", "待命名");
      lAlerts.innerHTML = alertHTML(
        `转写完成（${r.engine}，${r.duration.toFixed(2)}s）。核对无误后即可保存。`, "ok");
    } catch (e) {
      newBadge("warn", "转写失败");
      lAlerts.innerHTML = alertHTML(e.message, "warn");
    } finally {
      btn.disabled = false; btn.textContent = old;
      updateTextHint();
    }
  });

  /* ---------- 新建音色：保存（音频 + 转写一起落盘） ---------- */
  $("#l-new-save").addEventListener("click", async () => {
    if (!lUpload) return;
    const name = lName.value.trim();
    if (!name) {
      lAlerts.innerHTML = alertHTML("请先填写音色名称。", "warn");
      lName.focus();
      return;
    }
    const btn = $("#l-new-save");
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "保存中…";
    newBadge("running", "保存中…");
    lAlerts.innerHTML = "";
    try {
      const r = await api("/api/voices", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, path: lUpload.path,
                               ref_text: lText.value.trim(),
                               trim: trimPayload() }),
      });
      applyVoices(r.voices);
      const nv = voices.find((v) => v.name === r.name);
      const saved = r.name;
      setUpload(null);
      if (nv) showVoice(nv);
      newBadge("done", `已保存 ${saved}`);
      lAlerts.innerHTML = alertHTML(
        `${r.message}${r.renamed ? `\n名称已自动去重为「${saved}」。` : ""}` +
        (r.note ? `\n${r.note}` : "") +
        (picked && picked.name === saved ? "" : "\n可以在「语音合成」页直接选用它。"),
        r.level);
    } catch (e) {
      newBadge("error", "保存失败");
      lAlerts.innerHTML = alertHTML(e.message, "error");
    } finally {
      btn.disabled = false; btn.textContent = old;
    }
  });

  /* ---------- 音色列表 ---------- */
  function applyVoices(list) {
    voices = list;
    sVoice.items.length = 0;
    voices.filter((v) => v.ref_audio).forEach((v) => sVoice.items.push(v.name));
    $("#s-voice-combo").classList.toggle("hidden", !sVoice.items.length);

    sel = sel.filter((n) => voices.some((v) => v.name === n));
    if (current) {
      const nc = voices.find((v) => v.name === current.name);
      nc ? (current = nc) : clearDetail();
    }
    if (picked) {
      const np = voices.find((v) => v.name === picked.name);
      if (np && np.ref_audio) picked = np;
      else { picked = null; sVoice.set(""); }
    }
    renderPick();
    updateGo();
    renderLib();
  }

  function setLibBadge(state, text) {
    const b = $("#l-badge");
    b.dataset.state = state;
    b.textContent = text;
  }

  function renderLib() {
    $("#l-count").textContent = voices.length;
    const list = $("#l-list");
    if (!voices.length) {
      list.innerHTML = '<p class="empty-note">还没有保存的音色。<br>在上方上传一段 '
        + `${lbl.recommended[0]}–${lbl.recommended[1]} 秒的参考音频，保存后即可在「语音合成」里使用。</p>`;
      $("#l-bulkbar").innerHTML = "";
      return;
    }
    list.innerHTML =
      `<table class="vtable"><thead><tr>
         <th style="width:34px"><input type="checkbox" data-role="all" aria-label="全选"></th>
         <th>音色</th><th style="width:74px">时长</th><th>参考文本</th><th class="vact">操作</th>
       </tr></thead><tbody>` +
      voices.map((v, i) => `<tr data-i="${i}" class="${current && current.name === v.name ? "sel" : ""}">
         <td><input type="checkbox" data-role="pick" ${sel.includes(v.name) ? "checked" : ""} aria-label="选择 ${esc(v.name)}"></td>
         <td class="vname">${esc(v.name)}${v.cached ? '<span class="vtag" title="参考音频已完成转写与编码，生成时直接复用">✓ 已缓存</span>' : ""}</td>
         <td class="vdur${isLong(v.duration) ? " long" : ""}"${isLong(v.duration) ? ' title="参考音频偏长，合成会明显变慢 —— 可裁剪到 10 秒以内"' : ""}>${fmtDur(v.duration)}</td>
         <td class="vref">${esc(v.ref_text || "—")}</td>
         <td class="vact">
           <button class="btn btn-secondary btn-sm" data-role="ren" ${v.url ? "" : "disabled"}>试听</button>
           <button class="btn btn-danger btn-sm" data-role="del">删除</button>
         </td></tr>`).join("") +
      "</tbody></table>";

    const bulk = $("#l-bulkbar");
    bulk.innerHTML = sel.length
      ? `<div class="selbar"><span>已勾选 ${sel.length} 项</span>
           <span class="sp"></span>
           <button class="btn btn-sm btn-ghost" data-role="clearsel">取消勾选</button>
           <button class="btn btn-sm btn-danger" data-role="bulkdel">删除所选</button></div>`
      : "";

    $$("tr[data-i]", list).forEach((tr) => {
      const i = +tr.dataset.i, v = voices[i];
      tr.addEventListener("click", (e) => {
        if (e.target.closest("input,button")) return;
        showVoice(v);
      });
      $("[data-role=pick]", tr).addEventListener("change", (e) => {
        if (e.target.checked) { if (!sel.includes(v.name)) sel.push(v.name); }
        else sel = sel.filter((n) => n !== v.name);
        renderLib();
      });
      const ren = $("[data-role=ren]", tr);
      if (ren) ren.addEventListener("click", () => showVoice(v, true));
      $("[data-role=del]", tr).addEventListener("click", () => askDelete([v.name]));
    });

    const all = $("[data-role=all]", list);
    all.addEventListener("change", (e) => {
      sel = e.target.checked ? voices.map((v) => v.name) : [];
      renderLib();
    });
    const cd = $("[data-role=bulkdel]", bulk);
    if (cd) cd.addEventListener("click", () => askDelete(sel.slice()));
    const cs = $("[data-role=clearsel]", bulk);
    if (cs) cs.addEventListener("click", () => { sel = []; renderLib(); });
  }

  function clearDetail() {
    current = null;
    $("#l-name").textContent = "未选择音色";
    setLibBadge("idle", "—");
    $("#l-empty").classList.remove("hidden");
    $("#l-detail").classList.add("hidden");
    $("#l-refplay").innerHTML = "";
    $("#l-reftext").value = "";
    $("#l-rename").value = "";
    $("#l-rename-btn").disabled = true;
    $("#l-trim-btn").disabled = true;
    $("#l-retrans-btn").disabled = true;
    $("#l-note").innerHTML = "";
  }

  function showVoice(v, focusRename) {
    current = v;
    $("#l-empty").classList.add("hidden");
    $("#l-detail").classList.remove("hidden");
    $("#l-name").textContent = v.name;
    setLibBadge("done", fmtDur(v.duration));
    $("#l-reftext").value = v.ref_text || "";
    $("#l-asr").textContent = BOOT.asr || "—";
    $("#l-rename").value = "";
    $("#l-rename-btn").disabled = false;
    $("#l-trim-btn").disabled = !v.url;
    $("#l-retrans-btn").disabled = !v.url;
    $("#l-note").innerHTML = "";

    const host = $("#l-refplay");
    host.innerHTML = "";
    if (v.url) {
      const box = document.createElement("div");
      host.appendChild(box);
      buildPlayer(box).audio.src = v.url;   // 与结果区同一套播放器，外观一致
      if (isLong(v.duration)) {
        host.insertAdjacentHTML("beforeend",
          `<p class="hint" style="margin:8px 0 0">参考音频 ${fmtDur(v.duration)}，偏长 —— `
        + "合成会明显变慢，建议用「裁剪参考音频」剪到 10 秒以内。</p>");
      }
    } else {
      host.innerHTML = '<p class="hint" style="margin:0">该音色的参考音频文件已丢失，请删除后重新上传。</p>';
    }
    renderLib();
    if (focusRename) $("#l-rename").focus();
  }

  function askDelete(names) {
    const bulk = $("#l-bulkbar");
    bulk.innerHTML = `<div class="confirm-bar">
        <span>确认删除 ${names.length} 个音色？参考音频会一并删除，<b>不可恢复</b>。</span>
        <span class="sp"></span>
        <button class="btn btn-sm btn-ghost" data-role="cancel">取消</button>
        <button class="btn btn-sm btn-danger-solid" data-role="ok">确认删除</button>
      </div>`;
    $("[data-role=cancel]", bulk).addEventListener("click", renderLib);
    $("[data-role=ok]", bulk).addEventListener("click", async () => {
      try {
        const r = await api("/api/voices/delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ names }),
        });
        const wasCurrent = !!(current && names.includes(current.name));
        if (wasCurrent) clearDetail();
        applyVoices(r.voices);
        setLibBadge("done", `已删除 ${r.removed.length} 个音色`);
        if (r.failed && r.failed.length) {
          $("#l-note").innerHTML = alertHTML(
            `有 ${r.failed.length} 个音色没能完全删除：\n`
            + r.failed.map((f) => `${f.name} — ${f.error}`).join("\n"), "warn");
        }
      } catch (e) {
        bulk.innerHTML = `<div class="confirm-bar">${esc(e.message)}
          <span class="sp"></span>
          <button class="btn btn-sm btn-ghost" data-role="cancel">关闭</button></div>`;
        $("[data-role=cancel]", bulk).addEventListener("click", renderLib);
      }
    });
  }

  /* ---------- 裁剪已有音色的参考音频 ---------- */
  const dlg = $("#dlg-trim");
  const dlgEd = createEditor($("#dlg-trim-editor"), {
    recommended: lbl.recommended, min: lbl.min,
  });
  let dlgVoice = null;

  $("#l-trim-btn").addEventListener("click", async () => {
    if (!current || !current.url) return;
    dlgVoice = current;
    $("#dlg-trim-title").textContent = `裁剪参考音频 · ${current.name}`;
    $("#dlg-trim-alerts").innerHTML = "";
    $("#dlg-trim-retr").checked = !(current.ref_text || "").trim();
    dlg.showModal();
    try {
      await dlgEd.load(current.url, `${current.name} · 参考音频`);
    } catch (e) {
      $("#dlg-trim-alerts").innerHTML = alertHTML(e.message, "error");
    }
  });
  $$('[data-role="close"]', dlg).forEach((b) => b.addEventListener("click", () => {
    dlgEd.pause(); dlg.close();
  }));
  dlg.addEventListener("close", () => { dlgEd.pause(); dlgVoice = null; });

  $("#dlg-trim-save").addEventListener("click", async () => {
    if (!dlgVoice) return;
    if (dlgEd.isWhole()) {
      $("#dlg-trim-alerts").innerHTML =
        alertHTML("选区覆盖了整段音频，没有可裁剪的部分。拖动两端缩小选区，或直接取消。", "warn");
      return;
    }
    const btn = $("#dlg-trim-save");
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "保存中…";
    $("#dlg-trim-alerts").innerHTML = "";
    const name = dlgVoice.name;
    try {
      const r = await api(`/api/voices/${encodeURIComponent(name)}/trim`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ trim: dlgEd.value(),
                               retranscribe: $("#dlg-trim-retr").checked }),
      });
      applyVoices(r.voices);
      dlgEd.pause();
      dlg.close();
      const nv = voices.find((v) => v.name === name);
      if (nv) showVoice(nv);
      $("#l-note").innerHTML = alertHTML(r.message, r.level);
    } catch (e) {
      $("#dlg-trim-alerts").innerHTML = alertHTML(e.message, "error");
    } finally {
      btn.disabled = false; btn.textContent = old;
    }
  });

  /* ---------- 重新转写 / 重命名 ---------- */
  $("#l-retrans-btn").addEventListener("click", async () => {
    if (!current) { $("#l-note").innerHTML = alertHTML("先在上方选择一个音色。", "warn"); return; }
    const btn = $("#l-retrans-btn");
    const name = current.name;
    btn.disabled = true;
    setLibBadge("running", "正在重新转写…");
    $("#l-note").innerHTML = "";
    try {
      const r = await api(`/api/voices/${encodeURIComponent(name)}/retranscribe`,
        { method: "POST" });
      applyVoices(r.voices);
      const nv = voices.find((v) => v.name === name);
      if (nv) showVoice(nv);
      setLibBadge(r.level === "warn" ? "warn" : "done", fmtDur(nv && nv.duration));
      $("#l-note").innerHTML = alertHTML(r.message, r.level);
    } catch (e) {
      setLibBadge("error", "转写失败");
      $("#l-note").innerHTML = alertHTML(e.message, "error");
    } finally {
      btn.disabled = false;
    }
  });

  $("#l-rename-btn").addEventListener("click", async () => {
    if (!current) { $("#l-note").innerHTML = alertHTML("先在上方选择一个音色。", "warn"); return; }
    const to = $("#l-rename").value.trim();
    if (!to) { $("#l-note").innerHTML = alertHTML("请输入新名称。", "warn"); $("#l-rename").focus(); return; }
    try {
      const r = await api(`/api/voices/${encodeURIComponent(current.name)}/rename`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to }),
      });
      applyVoices(r.voices);
      const nv = voices.find((v) => v.name === r.name);
      if (nv) showVoice(nv);
      $("#l-note").innerHTML = alertHTML(
        r.renamed ? `已重命名为「${r.name}」（原名已占用，自动去重）。` : "已重命名。", "ok");
    } catch (e) {
      $("#l-note").innerHTML = alertHTML(e.message, "error");
    }
  });

  /* ---------- 环境与排错 ---------- */
  const p = BOOT.profile;
  const rows = p.rows.map(([k, v]) =>
    `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("");
  const notes = (p.notes || []).map((n) => `<p>· ${esc(n)}</p>`).join("");
  const diagHTML = `<div class="card"><div class="card-head"><h2>运行环境与排错</h2></div>
      <div class="card-body">
        <p class="hint">当前档位：<code>${esc(p.short)}</code></p>
        ${notes}
        <table class="kv" style="margin-top:12px">${rows}</table>
      </div></div>`;
  [$("#s-result"), $("#d-result")].forEach((h) => h.insertAdjacentHTML("beforeend", diagHTML));
  if (BOOT.asr) $("#l-asr").textContent = BOOT.asr;
  if (BOOT.load_note) {
    sRes.alerts.innerHTML = alertHTML(BOOT.load_note, "warn");
    dRes.alerts.innerHTML = alertHTML(BOOT.load_note, "warn");
  }

  /* ============================================================
     合成记录：每次合成的参数与产物
     后端已经把记录写进 outputs/history.json，这里只负责呈现。
     列表默认不挂播放器 —— 一屏二十条就是二十次音频解码，等真要听时再建。
     ============================================================ */
  let hist = [], histLoaded = false;
  const hList = $("#h-list"), hAlerts = $("#h-alerts");

  const fmtWhen = (ts) => {
    const d = new Date(ts * 1000), now = new Date();
    const p = (n) => String(n).padStart(2, "0");
    const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
    return d.toDateString() === now.toDateString()
      ? `今天 ${hm}` : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  };
  const modeName = (m) => (m === "design" ? "语音设计" : "语音合成");

  function histRow(it) {
    const ok = it.kind === "ok";
    const gone = ok && it.exists === false;              // 记录还在，wav 已被人删掉

    /* 统计项各占一格（宽度由 .hm-* 定住），跨记录对齐；
       拼成一整句「· A · B · C」会随各项长度不同越飘越远。 */
    const meta = [
      ["mode", modeName(it.mode)],
      it.language && it.language !== "Auto" ? ["lang", it.language] : null,
      it.duration ? ["dur", `音频 ${it.duration.toFixed(2)}s`] : null,
      it.cost ? ["cost", `耗时 ${it.cost.toFixed(1)}s`] : null,
      it.rtf ? ["rtf", `RTF ${it.rtf}`] : null,
      it.first_load ? ["note", "含首次加载模型"] : null,
    ].filter(Boolean);

    const row = document.createElement("div");
    row.className = "hrow" + (ok ? "" : " err") + (gone ? " gone" : "");
    row.innerHTML =
      `<div class="hrow-top">
         <span class="badge" data-state="${ok ? "done" : "error"}">${ok ? "成功" : "失败"}</span>
         ${it.voice ? `<span class="hrow-voice">${esc(it.voice)}</span>` : ""}
         ${it.instruct ? `<span class="hrow-instr">${esc(it.instruct)}</span>` : ""}
         <span class="hrow-time">${fmtWhen(it.ts)}</span>
       </div>
       <div class="hrow-meta">
         ${meta.map(([k, v]) => `<span class="hm-${k}">${esc(v)}</span>`).join("")}
       </div>
       <p class="hrow-text">${esc(ok ? it.text : (it.message || "生成失败"))}</p>
       <div class="hrow-slot" data-role="slot"></div>
       <div class="hrow-acts">
         ${ok && !gone ? '<button type="button" class="btn btn-ghost btn-sm" data-role="listen">试听</button>' : ""}
         ${gone ? '<span class="hint">音频文件已不在 outputs/</span>' : ""}
         <span class="sp"></span>
         ${ok ? '<button type="button" class="btn btn-secondary btn-sm" data-role="reuse">重新生成</button>' : ""}
         ${ok && !gone ? `<a class="btn btn-ghost btn-sm" href="${esc(it.url)}" download="${esc(it.file)}">下载</a>` : ""}
         <button type="button" class="btn btn-ghost btn-sm" data-role="del">删除</button>
       </div>`;

    const slot = $("[data-role=slot]", row);
    const listen = $("[data-role=listen]", row);
    let pl = null;
    if (listen) {
      listen.addEventListener("click", () => {
        if (pl) { pl.destroy(); pl = null; slot.innerHTML = ""; listen.textContent = "试听"; return; }
        pl = buildPlayer(slot, { name: it.voice || "合成结果" });
        pl.audio.src = it.url;
        pl.audio.play().catch(() => { /* 点击本身即用户手势，一般不会走到这 */ });
        listen.textContent = "收起";
      });
    }
    const reuse = $("[data-role=reuse]", row);
    if (reuse) reuse.addEventListener("click", () => reuseEntry(it));
    $("[data-role=del]", row).addEventListener("click", () => dropHist([it.id]));
    return row;
  }

  /* 「重新生成」把当时的输入填回对应的页，而不是直接跑一遍 ——
     直接重跑会让人来不及改文本或换音色，而改一个字常常正是他要的。 */
  function reuseEntry(it) {
    hAlerts.innerHTML = "";
    if (it.mode === "design") {
      gotoTab("design");
      $("#d-text").value = it.text || "";
      const g = it.groups || [];
      attrSels.forEach((sel, i) => { sel.value = g[i] || "Auto"; });
      updatePreview();
      $("#d-text").focus();
      return;
    }
    const hit = voices.find((v) => v.name === it.voice && v.ref_audio);
    gotoTab("synth");
    if (hit) {
      picked = hit;
      sVoice.set(hit.name);
      renderPick(true);
    } else {
      sRes.alerts.innerHTML = alertHTML(
        it.voice ? `音色「${it.voice}」已不在音色库里，请重新选一个再生成。`
                 : "这条记录没有留下音色，请重新选一个再生成。", "warn");
    }
    $("#s-text").value = it.text || "";
    applyInstruct(it.instruct);
    updateGo();
    $("#s-text").focus();
  }

  function renderHistory() {
    const q = ($("#h-q").value || "").trim().toLowerCase();
    const list = q
      ? hist.filter((x) => `${x.text} ${x.voice || ""} ${x.instruct || ""}`
          .toLowerCase().includes(q))
      : hist;
    const okN = hist.filter((x) => x.kind === "ok").length;
    const badge = $("#h-count");
    badge.dataset.state = okN ? "done" : "idle";
    badge.textContent = !histLoaded ? "—"
      : (hist.length ? `${okN} 成功 · 共 ${hist.length} 条` : "暂无记录");

    hList.innerHTML = "";
    if (!list.length) {
      hList.innerHTML = `<div class="h-empty">${!histLoaded
        ? "正在读取…"
        : (hist.length
            ? "没有匹配的记录。"
            : "还没有合成记录。<br>到「语音合成」或「语音设计」生成一次，这里就会出现。"
              + "<br>原始数据在 <code>outputs/history.json</code>。")}</div>`;
      return;
    }
    list.forEach((it) => hList.appendChild(histRow(it)));
  }

  async function loadHistory() {
    try {
      const r = await api("/api/history");
      hist = r.items || [];
      histLoaded = true;
      renderHistory();
    } catch (e) {
      hAlerts.innerHTML = alertHTML(`读取合成记录失败：${e.message}`, "error");
    }
  }

  async function dropHist(ids) {
    try {
      const r = await api("/api/history/delete", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids }),
      });
      hist = r.items || [];
      renderHistory();
    } catch (e) {
      hAlerts.innerHTML = alertHTML(e.message, "error");
    }
  }

  // 合成刚结束就顺手刷一下，免得切到记录页看到的还是旧列表
  function afterJob() { if (histLoaded) loadHistory(); }

  $("#h-refresh").addEventListener("click", () => { hAlerts.innerHTML = ""; loadHistory(); });
  $("#h-q").addEventListener("input", () => { if (histLoaded) renderHistory(); });

  let clearTimer = 0;
  $("#h-clear").addEventListener("click", async () => {
    const b = $("#h-clear");
    if (!clearTimer) {                     // 两步确认：清空是不可撤销的
      b.textContent = "确认清空？";
      clearTimer = setTimeout(() => { clearTimer = 0; b.textContent = "清空记录"; }, 4000);
      return;
    }
    clearTimeout(clearTimer); clearTimer = 0; b.textContent = "清空记录";
    try {
      const r = await api("/api/history/clear", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
      });
      hist = r.items || []; histLoaded = true;
      renderHistory();
      hAlerts.innerHTML = alertHTML(
        `已清空 ${r.removed} 条记录。outputs/ 里的 wav 文件保留，需要的话请手动清理。`, "ok");
    } catch (e) {
      hAlerts.innerHTML = alertHTML(e.message, "error");
    }
  });

  /* ---------- 标签页 ---------- */
  const PANELS = ["synth", "design", "library", "history"];
  function gotoTab(name) {
    $$(".tab").forEach((x) =>
      x.setAttribute("aria-selected", String(x.dataset.panel === name)));
    PANELS.forEach((n) => $("#panel-" + n).classList.toggle("hidden", n !== name));
    if (name === "history") loadHistory();      // 每次进来都拉一遍，刚生成的才在
    // 波形在隐藏状态下 clientWidth 为 0，切回来必须重画一次
    requestAnimationFrame(() => WAVE_REDRAW.forEach((f) => { try { f(); } catch (_) {} }));
  }
  $$(".tab").forEach((t) => t.addEventListener("click", () => gotoTab(t.dataset.panel)));

  /* ---------- 首次渲染 ---------- */
  sVoice.items.length = 0;
  voices.filter((v) => v.ref_audio).forEach((v) => sVoice.items.push(v.name));
  $("#s-voice-combo").classList.toggle("hidden", !sVoice.items.length);
  renderPick(true);
  updateGo();
  renderLib();
  renderHistory();      // 先摆占位，真正数据在首次切到该页时拉取
}
main().catch((e) => {
  // 初始化失败必须「看得见」：原先把提示写进已隐藏的 #boot，等于静默失败。
  console.error(e);
  const boot = $("#boot");
  if (boot) {
    boot.classList.remove("hidden");
    boot.innerHTML =
      `<p style="color:var(--err-fg);font-weight:600">界面初始化失败</p>
       <pre style="color:var(--err-fg);white-space:pre-wrap;font-size:12px;margin-top:6px">${esc(e.stack || e.message)}</pre>`;
  }
});
})();
</script>
</body>
</html>
